<html>
    <head>
        <title>Register</title>
    </head>
    <style>
        body{
            background-image: url("https://wallpapers.com/images/hd/solid-background-xxu1x46h3p1ofrvk.jpg");
            background-size: cover;
        }

    </style>
    <body>
        <section id="register">
    <h2>📝 Event Registration Form</h2>

    <p>
        🎉 Register now to participate in TechFest 2K26 and showcase your skills.
    </p>

    <form action="Submit.html">

        <fieldset>
            <legend>👤 Personal Information</legend>

            <label>Full Name:</label><br>
            <input type="text" required><br><br>

            <label>Roll Number:</label><br>
            <input type="text" required><br><br>

            <label>Email:</label><br>
            <input type="email" required><br><br>

            <label>Phone Number:</label><br>
            <input type="tel" ><br><br>
        </fieldset>

        <br>

        <fieldset>
            <legend>🎓 Academic Information</legend>

            <label>Department:</label><br>
            <select required>
                <option>Select Department</option>
                <option>CSE</option>
                <option>ECE</option>
                <option>EEE</option>
                <option>IT</option>
                <option>MECH</option>
            </select><br><br>

            <label>Gender:</label><br>
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
            <input type="radio" name="gender"> Other
        </fieldset>

        <br>

        <fieldset>
            <legend>🏆 Event Selection</legend>

            <input type="checkbox"> 💻 Coding Contest <br>
            <input type="checkbox"> 🎨 Web Design Competition <br>
            <input type="checkbox"> 🧠 Quiz Competition <br>
            <input type="checkbox"> 📄 Paper Presentation
        </fieldset>

        <br>

        <input type="submit" value=" Submit Registration">

    </form>
</section>
<a href="collage-fest.html">
         <button style="background-color: #4CAF50; color: white; border:1px solid #020602;  padding: 10px 20px;  border-radius: 4px; ">Back to home</button>
        </a>
    </body>
</html>
